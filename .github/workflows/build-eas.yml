name: Build APK on Expo (EAS)

# Needs the repository secret EXPO_TOKEN (Settings > Secrets and variables > Actions).
# Runs on every push to main, or by hand: Actions > "Build APK on Expo (EAS)" > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check the Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci && npm install -g eas-cli
      - name: Link the Expo project
        run: eas init --non-interactive --force
      - name: Build on Expo's servers
        run: |
          eas build -p android --profile preview --non-interactive --wait --json > build.json
          URL=$(node -e 'const b=require("./build.json");console.log((Array.isArray(b)?b[0]:b).artifacts.buildUrl)')
          curl -sSL "$URL" -o MPC-Remote.apk
          ls -la MPC-Remote.apk
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "eas-${{ github.run_number }}" MPC-Remote.apk --title "MPC Remote (Expo build ${{ github.run_number }})" --notes "Built on Expo's servers. Download MPC-Remote.apk on the phone and install it."
